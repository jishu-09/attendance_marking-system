<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Marking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .add {
            background: #007bff;
        }

        .present {
            background: green;
        }

        .absent {
            background: red;
        }

        .delete {
            background: #555;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background: #333;
            color: white;
        }

        .summary {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📋 Attendance Marking System</h1>

    <input
        type="text"
        id="studentName"
        placeholder="Enter student name"
    >

    <button class="add" onclick="addStudent()">
        Add Student
    </button>

    <table>

        <thead>
            <tr>
                <th>Student Name</th>
                <th>Attendance</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentList">
        </tbody>

    </table>

    <div class="summary" id="summary">
        Present: 0 | Absent: 0
    </div>

</div>


<script>

    // Get students from browser storage
    let students = JSON.parse(
        localStorage.getItem("students")
    ) || [];


    // Add a student
    function addStudent() {

        let name = document.getElementById("studentName").value.trim();

        if (name === "") {
            alert("Please enter student name");
            return;
        }

        students.push({
            name: name,
            status: "Not Marked"
        });

        saveData();

        document.getElementById("studentName").value = "";

        displayStudents();
    }


    // Mark attendance
    function markAttendance(index, status) {

        students[index].status = status;

        saveData();

        displayStudents();
    }


    // Delete student
    function deleteStudent(index) {

        students.splice(index, 1);

        saveData();

        displayStudents();
    }


    // Save data
    function saveData() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );
    }


    // Display students
    function displayStudents() {

        let list = document.getElementById("studentList");

        list.innerHTML = "";

        let present = 0;
        let absent = 0;

        students.forEach(function(student, index) {

            if (student.status === "Present") {
                present++;
            }

            if (student.status === "Absent") {
                absent++;
            }

            list.innerHTML += `
                <tr>

                    <td>${student.name}</td>

                    <td>

                        <button
                            class="present"
                            onclick="markAttendance(${index}, 'Present')">
                            Present
                        </button>

                        <button
                            class="absent"
                            onclick="markAttendance(${index}, 'Absent')">
                            Absent
                        </button>

                    </td>

                    <td>

                        <button
                            class="delete"
                            onclick="deleteStudent(${index})">
                            Delete
                        </button>

                    </td>

                </tr>
            `;
        });


        document.getElementById("summary").innerHTML =
            "Present: " + present +
            " | Absent: " + absent +
            " | Total: " + students.length;
    }


    // Load students when page opens
    displayStudents();

</script>

</body>
</html>
